name: Build Madeira (macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on macOS (Xcode)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies (Homebrew)
        run: |
          brew update
          brew install cmake ninja pkg-config

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('**/*.xcodeproj/**', '**/*.xcworkspace/**', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-

      - name: List project structure
        run: find . -maxdepth 3 -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Package.swift" | head -20

      - name: Build with xcodebuild
        run: |
          PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" | head -1)
          SCHEME=$(xcodebuild -project "$PROJ" -list 2>/dev/null | awk '/Schemes:/,0' | tail -n +2 | head -1 | xargs)
          echo "Project: $PROJ | Scheme: $SCHEME"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Build
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphonesimulator/*.app
          retention-days: 14
          if-no-files-found: warn